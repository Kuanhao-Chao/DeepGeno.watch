name: Literature ingestion

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery trigger recorded in provenance
        type: choice
        options:
          - manual
          - replay
        default: manual
      from:
        description: Optional first date (YYYY-MM-DD; pair with through)
        type: string
        required: false
      through:
        description: Optional final date (YYYY-MM-DD; pair with from)
        type: string
        required: false
      backfill_days:
        description: Optional bounded backfill (0–90 days)
        type: number
        default: 0
      batch_days:
        description: Maximum days per discovery batch (1–30)
        type: number
        default: 30
      shadow:
        description: Discover and report without commits or pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: literature-state
  cancel-in-progress: false

jobs:
  discover:
    name: Discover and open Gate 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPGENO_PROJECT_ROOT: ${{ runner.temp }}/deepgeno-engine
      DEEPGENO_STATE_ROOT: ${{ github.workspace }}
    steps:
      - name: Mint private-state token
        id: private-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEEPGENO_PUBLIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEEPGENO_PUBLIC_APP_PRIVATE_KEY }}
          owner: Kuanhao-Chao
          repositories: DeepGeno.watch-state
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Check out trusted private main
        uses: actions/checkout@v6
        with:
          repository: Kuanhao-Chao/DeepGeno.watch-state
          ref: main
          token: ${{ steps.private-app-token.outputs.token }}
          fetch-depth: 0
      - name: Bootstrap pinned public engine
        uses: ./.github/actions/bootstrap-engine
      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ runner.temp }}/deepgeno-engine/.nvmrc
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/deepgeno-engine/package-lock.json
      - name: Install pinned engine dependencies
        run: npm ci
        working-directory: ${{ runner.temp }}/deepgeno-engine
      - name: Confirm private repository boundary
        run: node "$DEEPGENO_PROJECT_ROOT/scripts/github/automation.mjs" assert-private
      - name: Discover papers
        run: node "$DEEPGENO_PROJECT_ROOT/scripts/github/automation.mjs" ingest
        env:
          GH_TOKEN: ${{ steps.private-app-token.outputs.token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_THROUGH: ${{ inputs.through }}
          INPUT_BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          INPUT_BATCH_DAYS: ${{ inputs.batch_days || '30' }}
          INPUT_SHADOW: ${{ github.event_name == 'schedule' && vars.DEEPGENO_LIVE_INGESTION_ENABLED != 'true' && 'true' || inputs.shadow || 'false' }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
