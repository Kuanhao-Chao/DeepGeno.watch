name: Literature ingestion

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery trigger recorded in provenance
        type: choice
        options:
          - manual
          - replay
        default: manual
      from:
        description: Optional first date (YYYY-MM-DD; pair with through)
        type: string
        required: false
      through:
        description: Optional final date (YYYY-MM-DD; pair with from)
        type: string
        required: false
      backfill_days:
        description: Optional bounded backfill (0–90 days)
        type: number
        default: 0
      batch_days:
        description: Maximum days per discovery batch (1–30)
        type: number
        default: 30
      shadow:
        description: Discover and report without commits or pull requests
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: literature-state
  cancel-in-progress: false

jobs:
  discover:
    name: Discover and open Gate 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Confirm private repository boundary
        run: node scripts/github/automation.mjs assert-private
      - name: Discover papers
        run: node scripts/github/automation.mjs ingest
        env:
          GH_TOKEN: ${{ secrets.DEEPGENO_GITHUB_TOKEN || github.token }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_THROUGH: ${{ github.event.inputs.through }}
          INPUT_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          INPUT_BATCH_DAYS: ${{ github.event.inputs.batch_days || '30' }}
          INPUT_SHADOW: ${{ github.event.inputs.shadow || 'false' }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
