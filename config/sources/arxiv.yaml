id: arxiv
kind: arxiv-oai
enabled: true
baseUrl: https://oaipmh.arxiv.org/oai
targets:
  - id: q-bio
    setSpec: q-bio
    categoryPrefixes:
      - q-bio.
  - id: cs
    setSpec: cs:cs:LG
    categoryPrefixes:
      - cs.LG
  - id: stat
    setSpec: stat:stat:ML
    categoryPrefixes:
      - stat.ML
overlapDays: 3
requestDelayMs: 3100
